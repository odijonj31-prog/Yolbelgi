<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>YoʻlBelgi</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#18212B; --bg2:#212D3A; --line:#34424F; --text:#F2F4F6; --muted:#9AA7B4;
  --yellow:#FFC72C; --red:#D62828; --blue:#1F5FBF; --ok:#2FB36D;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Barlow',system-ui,sans-serif;font-size:16px;line-height:1.4}
body{overflow-x:hidden}

/* Orqa fon: asfalt, yoʻl chetidagi yurayotgan chiziqlar */
.bg{position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(520px 360px at 92% -6%, rgba(31,95,191,.32), transparent 70%),
    radial-gradient(480px 380px at -8% 104%, rgba(255,199,44,.10), transparent 70%),
    var(--bg)}
.bg::after{content:"";position:absolute;inset:0;opacity:.07;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.edge{position:fixed;top:0;bottom:0;width:4px;z-index:-1;pointer-events:none;opacity:.22;
  background:repeating-linear-gradient(180deg,var(--yellow) 0 26px,transparent 26px 52px);
  animation:roll 2.6s linear infinite}
.edge.l{left:8px} .edge.r{right:8px}
@keyframes roll{to{background-position-y:52px}}

#app{max-width:520px;margin:0 auto;min-height:100vh;padding-top:env(safe-area-inset-top)}
#app.enter>*{animation:rise .28s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}

/* Bosh sahifa */
.top{padding:28px 20px 20px}
.top h1{margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:56px;line-height:1;letter-spacing:-.5px;user-select:none;-webkit-user-select:none}
.top p{margin:8px 0 0;color:var(--muted);font-size:17px}
.road{position:relative;overflow:hidden;display:flex;gap:32px;padding:18px 20px 30px;background:rgba(33,45,58,.85);border-top:2px solid var(--line)}
.road::after{content:"";position:absolute;left:0;right:0;bottom:10px;height:4px;
  background:repeating-linear-gradient(90deg,var(--yellow) 0 22px,transparent 22px 40px)}
.cruise{position:absolute;left:-60px;bottom:1px;width:44px;height:20px;animation:drive 11s linear infinite;z-index:1}
@keyframes drive{from{transform:translateX(0)}to{transform:translateX(calc(100vw + 80px))}}
.stat b{display:block;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:38px;line-height:1}
.stat span{color:var(--muted);font-size:14px}
.menu{padding:8px 0 0}
.row{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:16px;width:100%;
  padding:16px 20px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left}
.row:active{background:var(--bg2)}
.row svg{transition:transform .2s}
.row:active svg{transform:scale(.9) rotate(-4deg)}
.row .t{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:26px;line-height:1.1}
.row .s{color:var(--muted);font-size:15px}
.row .go{color:var(--muted);font-size:24px;white-space:nowrap}
.row.plain{grid-template-columns:1fr auto}
.badge{background:var(--red);color:#fff;border-radius:12px;padding:1px 9px;font-weight:600;font-size:14px;margin-right:8px}
.note{padding:20px;color:var(--muted);font-size:14px}

/* Test */
.qhead{display:flex;align-items:center;gap:12px;padding:14px 16px}
.x{background:none;border:0;font-size:22px;padding:4px 8px;color:var(--muted)}
.dashes{flex:1;display:flex;gap:3px}
.d{flex:1;height:6px;border-radius:3px;background:var(--line);display:block;transition:background .3s}
.d.on{background:var(--yellow)} .d.cur{background:var(--text)}
.cnt,.timer{font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;font-size:15px}
.timer{color:var(--yellow)}
.qbody{padding:8px 16px 120px}
.signbox,.scene{display:flex;justify-content:center;padding:14px 0 6px;min-height:20px}
.signbox svg,.scene svg,.scene img{display:block;border-radius:12px;animation:pop .45s cubic-bezier(.2,1.3,.4,1) both}
.scene img{max-width:100%;max-height:260px;object-fit:contain;background:#0f151c}
.ph{width:100%;height:120px;border-radius:12px;background:linear-gradient(90deg,var(--bg2),#2b3a4a,var(--bg2));background-size:200% 100%;animation:shimmer 1.2s linear infinite}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes shimmer{to{background-position:-200% 0}}
.qt{font-size:22px;line-height:1.25;font-weight:600;margin:14px 0 18px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:14px;
  background:rgba(33,45,58,.9);border:2px solid var(--line);border-radius:12px;font-size:17px;
  transition:transform .12s,background .2s,border-color .2s}
.opt:active{transform:scale(.98)}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--muted);
  display:grid;place-items:center;font-weight:600;font-size:14px;color:var(--muted);transition:all .2s}
.opt.right{border-color:var(--ok);background:rgba(47,179,109,.16);animation:good .4s ease-out}
.opt.right .l{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--red);background:rgba(214,40,40,.18);animation:shake .4s ease-out}
.opt.wrong .l{background:var(--red);border-color:var(--red);color:#fff}
@keyframes good{50%{transform:scale(1.025)}}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.lock{pointer-events:none}
.fb{margin-top:16px;padding:12px 14px;border-left:4px solid var(--yellow);background:var(--bg2);border-radius:0 10px 10px 0;animation:rise .3s ease-out}
.fb b{display:block;margin-bottom:2px}
.fb.ok b{color:var(--ok)} .fb.bad b{color:#FF6B6B}
.fb p{margin:0;color:#D5DBE1}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(transparent,var(--bg) 30%)}
.bar>*{max-width:488px;margin:0 auto;display:block}
.btn{width:100%;height:52px;border:0;border-radius:12px;background:var(--yellow);color:#16202A;font-weight:600;font-size:18px;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:none;border:2px solid var(--line);color:var(--text);margin-top:10px}
.btn.danger{background:none;border:2px solid var(--red);color:#FF8A8A;height:40px;font-size:15px;width:auto;padding:0 14px}
.ttl{margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:26px}

/* Natija */
.res{padding:32px 20px 40px}
.res .big{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:96px;line-height:1}
.res .big small{font-size:40px;color:var(--muted)}
.res h2{margin:10px 0 4px;font-size:26px}
.res p{color:var(--muted);margin:0 0 22px}
.wl{margin:8px 0 22px;border-top:1px solid var(--line)}
.wl div{padding:14px 0;border-bottom:1px solid var(--line)}
.wl b{display:block;margin-bottom:4px}
.wl span{color:var(--ok);display:block}
.wl em{font-style:normal;color:var(--muted);font-size:15px}
.empty{padding:60px 24px;text-align:center}
.empty p{color:var(--muted);margin:14px 0 24px}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.confetti i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;opacity:0;animation:fall 2.2s ease-in forwards}
@keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(105vh) rotate(540deg)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .cruise,.confetti{display:none}
}
</style>
</head>
<body>
<div class="bg"></div><div class="edge l"></div><div class="edge r"></div>
<div id="app"></div>

<script>
/* ---------- Sozlamalar / Telegram ---------- */
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor('#18212B'); tg.setBackgroundColor('#18212B'); } catch(e){} }
function haptic(ok){ try { tg.HapticFeedback.notificationOccurred(ok ? 'success' : 'error'); } catch(e){} }
/* ---------- Yoʻl belgilari (SVG) ---------- */
const SIGNS = {
  stop:{name:"STOP: toʻxtab, yoʻl bering", svg:`<polygon points="30,4 70,4 96,30 96,70 70,96 30,96 4,70 4,30" fill="#D62828" stroke="#fff" stroke-width="4"/><text x="50" y="59" text-anchor="middle" font-family="Barlow Condensed,Arial" font-weight="800" font-size="30" fill="#fff">STOP</text>`},
  yield:{name:"Yoʻl bering", svg:`<polygon points="8,14 92,14 50,90" fill="#fff" stroke="#D62828" stroke-width="10" stroke-linejoin="round"/>`},
  noentry:{name:"Kirish taqiqlangan", svg:`<circle cx="50" cy="50" r="46" fill="#D62828"/><rect x="18" y="43" width="64" height="14" fill="#fff"/>`},
  mainroad:{name:"Asosiy yoʻl", svg:`<polygon points="50,3 97,50 50,97 3,50" fill="#fff"/><polygon points="50,12 88,50 50,88 12,50" fill="#F5B800" stroke="#111" stroke-width="2"/>`},
  speed:{name:"Tezlik cheklangan (40 km/soat)", svg:`<circle cx="50" cy="50" r="46" fill="#D62828"/><circle cx="50" cy="50" r="33" fill="#fff"/><text x="50" y="62" text-anchor="middle" font-family="Barlow Condensed,Arial" font-weight="800" font-size="34" fill="#111">40</text>`},
  noparking:{name:"Turish taqiqlangan", svg:`<circle cx="50" cy="50" r="46" fill="#D62828"/><circle cx="50" cy="50" r="36" fill="#1F5FBF"/><line x1="26" y1="74" x2="74" y2="26" stroke="#D62828" stroke-width="9"/>`},
  nostop:{name:"Toʻxtash va turish taqiqlangan", svg:`<circle cx="50" cy="50" r="46" fill="#D62828"/><circle cx="50" cy="50" r="36" fill="#1F5FBF"/><line x1="26" y1="74" x2="74" y2="26" stroke="#D62828" stroke-width="9"/><line x1="26" y1="26" x2="74" y2="74" stroke="#D62828" stroke-width="9"/>`},
  pedestrian:{name:"Piyodalar oʻtish joyi", svg:`<rect x="4" y="4" width="92" height="92" rx="8" fill="#1F5FBF" stroke="#fff" stroke-width="3"/><polygon points="50,14 86,82 14,82" fill="#fff"/><circle cx="50" cy="48" r="5" fill="#111"/><path d="M50 54 L50 68 M50 68 L43 78 M50 68 L57 78 M50 58 L42 64 M50 58 L58 62" stroke="#111" stroke-width="4" stroke-linecap="round" fill="none"/>`},
  noovertake:{name:"Quvib oʻtish taqiqlangan", svg:`<circle cx="50" cy="50" r="46" fill="#D62828"/><circle cx="50" cy="50" r="35" fill="#fff"/><rect x="27" y="34" width="20" height="34" rx="6" fill="#111"/><rect x="53" y="34" width="20" height="34" rx="6" fill="#D62828"/>`},
  danger:{name:"Boshqa xavf (ehtiyot boʻling)", svg:`<polygon points="50,6 96,88 4,88" fill="#fff" stroke="#D62828" stroke-width="9" stroke-linejoin="round"/><rect x="46" y="34" width="8" height="30" rx="3" fill="#111"/><circle cx="50" cy="75" r="5" fill="#111"/>`},
  nouturn:{name:"Burilib qaytish taqiqlangan", svg:`<circle cx="50" cy="50" r="46" fill="#D62828"/><circle cx="50" cy="50" r="35" fill="#fff"/><path d="M38 72 V44 a12 12 0 0 1 24 0 V56" stroke="#111" stroke-width="7" fill="none"/><polygon points="53,54 71,54 62,68" fill="#111"/><line x1="24" y1="24" x2="76" y2="76" stroke="#D62828" stroke-width="8"/>`},
  noleft:{name:"Chapga burilish taqiqlangan", svg:`<circle cx="50" cy="50" r="46" fill="#D62828"/><circle cx="50" cy="50" r="35" fill="#fff"/><path d="M58 76 V50 H42" stroke="#111" stroke-width="8" fill="none"/><polygon points="44,36 44,64 26,50" fill="#111"/><line x1="24" y1="24" x2="76" y2="76" stroke="#D62828" stroke-width="8"/>`},
  noright:{name:"Oʻngga burilish taqiqlangan", svg:`<circle cx="50" cy="50" r="46" fill="#D62828"/><circle cx="50" cy="50" r="35" fill="#fff"/><path d="M42 76 V50 H58" stroke="#111" stroke-width="8" fill="none"/><polygon points="56,36 56,64 74,50" fill="#111"/><line x1="76" y1="24" x2="24" y2="76" stroke="#D62828" stroke-width="8"/>`},
  straight:{name:"Faqat toʻgʻriga", svg:`<circle cx="50" cy="50" r="46" fill="#1F5FBF" stroke="#fff" stroke-width="3"/><rect x="45" y="42" width="10" height="34" fill="#fff"/><polygon points="50,20 70,46 30,46" fill="#fff"/>`},
  rightturn:{name:"Faqat oʻngga", svg:`<circle cx="50" cy="50" r="46" fill="#1F5FBF" stroke="#fff" stroke-width="3"/><path d="M40 78 V52 H60" stroke="#fff" stroke-width="10" fill="none"/><polygon points="58,34 58,70 80,52" fill="#fff"/>`},
  leftturn:{name:"Faqat chapga", svg:`<circle cx="50" cy="50" r="46" fill="#1F5FBF" stroke="#fff" stroke-width="3"/><path d="M60 78 V52 H40" stroke="#fff" stroke-width="10" fill="none"/><polygon points="42,34 42,70 20,52" fill="#fff"/>`},
  oneway:{name:"Bir tomonlama harakat", svg:`<rect x="12" y="4" width="76" height="92" rx="8" fill="#1F5FBF" stroke="#fff" stroke-width="3"/><rect x="45" y="44" width="10" height="38" fill="#fff"/><polygon points="50,18 72,48 28,48" fill="#fff"/>`},
  parking:{name:"Toʻxtab turish joyi", svg:`<rect x="4" y="4" width="92" height="92" rx="10" fill="#1F5FBF" stroke="#fff" stroke-width="3"/><text x="50" y="74" text-anchor="middle" font-family="Barlow,Arial" font-weight="800" font-size="70" fill="#fff">P</text>`},
  noallveh:{name:"Harakat taqiqlangan", svg:`<circle cx="50" cy="50" r="46" fill="#D62828"/><circle cx="50" cy="50" r="35" fill="#fff"/>`},
  notrucks:{name:"Yuk avtomobillari harakati taqiqlangan", svg:`<circle cx="50" cy="50" r="46" fill="#D62828"/><circle cx="50" cy="50" r="35" fill="#fff"/><rect x="24" y="38" width="30" height="24" fill="#111"/><rect x="54" y="46" width="20" height="16" fill="#111"/><circle cx="36" cy="66" r="5.5" fill="#111"/><circle cx="64" cy="66" r="5.5" fill="#111"/>`},
  nopedestrian:{name:"Piyodalar harakati taqiqlangan", svg:`<circle cx="50" cy="50" r="46" fill="#D62828"/><circle cx="50" cy="50" r="35" fill="#fff"/><circle cx="50" cy="30" r="5.5" fill="#111"/><path d="M50 37 L50 56 M50 56 L41 72 M50 56 L59 72 M50 41 L40 52 M50 41 L60 50" stroke="#111" stroke-width="5" stroke-linecap="round" fill="none"/>`},
  crossroadwarn:{name:"Teng ahamiyatli yoʻllar kesishmasi", svg:`<polygon points="50,6 96,88 4,88" fill="#fff" stroke="#D62828" stroke-width="9" stroke-linejoin="round"/><rect x="46" y="36" width="8" height="42" fill="#111"/><rect x="30" y="54" width="40" height="8" fill="#111"/>`},
  lightwarn:{name:"Svetofor bilan tartibga solish", svg:`<polygon points="50,6 96,88 4,88" fill="#fff" stroke="#D62828" stroke-width="9" stroke-linejoin="round"/><rect x="41" y="30" width="18" height="46" rx="4" fill="#111"/><circle cx="50" cy="39" r="4.5" fill="#E53935"/><circle cx="50" cy="53" r="4.5" fill="#FFC72C"/><circle cx="50" cy="67" r="4.5" fill="#2FB36D"/>`}
};
function icon(key, size){
  return `<svg viewBox="0 0 100 100" width="${size}" height="${size}" role="img" aria-label="${SIGNS[key].name}">${SIGNS[key].svg}</svg>`;
}
const miniSign = (key,x,y,s) => `<svg x="${x}" y="${y}" width="${s}" height="${s}" viewBox="0 0 100 100">${SIGNS[key].svg}</svg>`;

/* ---------- Sahnalar: chorraha, svetofor, chiziqlar ---------- */
const car = (x,y,r,c,l) => `<g transform="translate(${x} ${y}) rotate(${r})"><rect x="-9" y="-16" width="18" height="32" rx="5" fill="${c}" stroke="#fff" stroke-width="1.5"/><rect x="-6" y="-11" width="12" height="7" rx="2" fill="#CFE6FF"/><text transform="rotate(${-r})" y="9" text-anchor="middle" font-family="Barlow,Arial" font-weight="700" font-size="11" fill="#fff">${l}</text></g>`;
const roadCross = `<rect width="240" height="160" fill="#2C3A47"/><rect x="0" y="55" width="240" height="50" fill="#4A5866"/><rect x="95" y="0" width="50" height="160" fill="#4A5866"/><g stroke="#fff" stroke-width="2" stroke-dasharray="8 6" opacity=".8"><line x1="0" y1="80" x2="95" y2="80"/><line x1="145" y1="80" x2="240" y2="80"/><line x1="120" y1="0" x2="120" y2="55"/><line x1="120" y1="105" x2="120" y2="160"/></g>`;
const light = on => {
  const k = on[0], flash = on.length > 1, col = {r:"#E53935", y:"#FFC72C", g:"#2FB36D"}, idx = {r:0, y:1, g:2};
  let s = `<rect x="10" y="5" width="60" height="140" rx="14" fill="#0E1319" stroke="#4A5866" stroke-width="3"/>`;
  s += ['r','y','g'].map((c,i) => `<circle cx="40" cy="${32+i*43}" r="16" fill="${c===k?col[c]:'#26303A'}">${(c===k&&flash)?'<animate attributeName="opacity" values="1;.2;1" dur="1s" repeatCount="indefinite"/>':''}</circle>`).join('');
  return s;
};
const hroad = dash => `<rect width="240" height="160" fill="#2C3A47"/><rect x="0" y="35" width="240" height="90" fill="#4A5866"/><line x1="0" y1="41" x2="240" y2="41" stroke="#fff" stroke-width="2"/><line x1="0" y1="119" x2="240" y2="119" stroke="#fff" stroke-width="2"/><line x1="0" y1="80" x2="240" y2="80" stroke="#fff" stroke-width="${dash?3:4}" ${dash?'stroke-dasharray="16 12"':''}/>` + car(60,100,90,"#D62828","") + car(170,60,-90,"#1F5FBF","");
const SCENES = {
  crossRight:{vb:"0 0 240 160", w:320, alt:"Chorraha: A pastdan, B oʻngdan yaqinlashmoqda", svg: roadCross + car(132,130,0,"#D62828","A") + car(190,67,-90,"#1F5FBF","B")},
  crossLeft:{vb:"0 0 240 160", w:320, alt:"Chorraha: A chapga buriladi, B qarshidan toʻgʻri ketadi", svg: roadCross + `<path d="M132 108 V92 Q132 67 100 67 H84" stroke="#FFC72C" stroke-width="3" fill="none"/><polygon points="86,60 86,74 74,67" fill="#FFC72C"/>` + car(132,132,0,"#D62828","A") + car(108,26,180,"#1F5FBF","B")},
  crossYield:{vb:"0 0 240 160", w:320, alt:"Chorraha: B oldida Yoʻl bering belgisi", svg: roadCross + car(132,130,0,"#D62828","A") + car(190,67,-90,"#1F5FBF","B") + miniSign("yield",200,26,28)},
  crossStop:{vb:"0 0 240 160", w:320, alt:"Chorraha: B oldida STOP belgisi", svg: roadCross + car(132,130,0,"#D62828","A") + car(190,67,-90,"#1F5FBF","B") + miniSign("stop",200,26,28)},
  crossMainRight:{vb:"0 0 240 160", w:320, alt:"Chorraha: A yoʻlida Asosiy yoʻl belgisi", svg: roadCross + car(132,130,0,"#D62828","A") + car(190,67,-90,"#1F5FBF","B") + miniSign("mainroad",150,108,28)},
  lightRed:{vb:"0 0 80 150", w:90, alt:"Svetofor: qizil", svg: light("r")},
  lightYellow:{vb:"0 0 80 150", w:90, alt:"Svetofor: sariq", svg: light("y")},
  lightGreen:{vb:"0 0 80 150", w:90, alt:"Svetofor: yashil", svg: light("g")},
  lightGreenFlash:{vb:"0 0 80 150", w:90, alt:"Svetofor: miltillovchi yashil", svg: light("gf")},
  lightYellowFlash:{vb:"0 0 80 150", w:90, alt:"Svetofor: miltillovchi sariq", svg: light("yf")},
  zebra:{vb:"0 0 240 160", w:320, alt:"Piyodalar oʻtish joyi", svg:`<rect width="240" height="160" fill="#2C3A47"/><rect x="50" y="0" width="140" height="160" fill="#4A5866"/><line x1="52" y1="0" x2="52" y2="160" stroke="#fff" stroke-width="2"/><line x1="188" y1="0" x2="188" y2="160" stroke="#fff" stroke-width="2"/>` + [68,88,108,128,148].map(x=>`<rect x="${x}" y="45" width="14" height="40" fill="#fff"/>`).join('') + car(155,132,0,"#D62828","")},
  lineSolid:{vb:"0 0 240 160", w:320, alt:"Yoʻl oʻrtasida sidirgʻa chiziq", svg: hroad(false)},
  lineDashed:{vb:"0 0 240 160", w:320, alt:"Yoʻl oʻrtasida uzuq-uzuq chiziq", svg: hroad(true)}
};
function sceneImg(key){
  const c = SCENES[key];
  return `<svg viewBox="${c.vb}" style="width:${c.w}px;max-width:100%" role="img" aria-label="${c.alt}">${c.svg}</svg>`;
}

const $app = document.getElementById('app');
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const dayStr = d => new Date(d).toISOString().slice(0,10);
const $ = id => document.getElementById(id);
const val = id => ($(id) ? $(id).value.trim() : '');

const DEFAULT = {answered:0, correct:0, mistakes:[], streak:0, last:''};
function load(){ try { return Object.assign({}, DEFAULT, JSON.parse(localStorage.getItem('yolbelgi_v1')||'{}')); } catch(e){ return Object.assign({}, DEFAULT); } }
function save(){ try { localStorage.setItem('yolbelgi_v1', JSON.stringify(store)); } catch(e){} }
let store = load();

function streakNow(){
  const t = dayStr(Date.now()), y = dayStr(Date.now()-864e5);
  return (store.last===t || store.last===y) ? store.streak : 0;
}
function touchStreak(){
  const t = dayStr(Date.now()), y = dayStr(Date.now()-864e5);
  if (store.last === t) return;
  store.streak = (store.last === y) ? store.streak + 1 : 1;
  store.last = t; save();
}
function record(q, ok){
  store.answered++; if (ok) store.correct++;
  if (q.id){
    const i = store.mistakes.indexOf(q.id);
    if (ok && i>=0) store.mistakes.splice(i,1);
    if (!ok && i<0) store.mistakes.push(q.id);
  }
  touchStreak(); save();
}

let screen = 'home', Z = null, timerId = null;
function stopTimer(){ if (timerId){ clearInterval(timerId); timerId = null; } }
function paint(html, name, noAnim){
  screen = name || screen;
  $app.innerHTML = html;
  if (!noAnim){ $app.classList.remove('enter'); void $app.offsetWidth; $app.classList.add('enter'); }
  try { if (tg && tg.BackButton){ (screen === 'home') ? tg.BackButton.hide() : tg.BackButton.show(); } } catch(e){}
  window.scrollTo(0,0);
}
try { if (tg && tg.BackButton) tg.BackButton.onClick(() => home()); } catch(e){}

    </nav>

  const set = new Set(QUESTIONS.map(q => q.t));
  return [...TOPIC_ORDER.filter(t => set.has(t)), ...[...set].filter(t => !TOPIC_ORDER.includes(t))];
}
function topics(){
  const item = (k, n, c) => `<button class="row plain" data-topic="${k}"><span class="t">${n}</span><span class="go">${c} ta ›</span></button>`;
  paint(`
    <div class="qhead"><button class="x" data-act="home" aria-label="Orqaga">←</button><h2 class="ttl">Mashq mavzusi</h2></div>
    <nav class="menu">
      ${item('all','Barcha savollar aralash',QUESTIONS.length)}
      ${topicNames().map(n => item(n, n, QUESTIONS.filter(q=>q.t===n).length)).join('')}
    </nav>`, 'topics');
}

/* ---------- Test mexanikasi ---------- */
function prep(list){
  return list.map(q => {
    const order = shuffle([0,1,2,3]);
    return Object.assign({}, q, { opts: order.map(k => q.o[k]), ans: order.indexOf(q.a) });
  });
}
function signQuestions(){
  const keys = Object.keys(SIGNS);
  return shuffle(keys).slice(0,10).map(k => {
    const others = shuffle(keys.filter(x => x !== k)).slice(0,3).map(x => SIGNS[x].name);
    const opts = shuffle([SIGNS[k].name, ...others]);
    return { sign:k, q:"Bu qanday belgi?", opts, ans: opts.indexOf(SIGNS[k].name), e:"Belgi nomi: " + SIGNS[k].name + "." };
  });
}
function startQuiz(mode, topic){
  stopTimer();
  let list;
  if (mode === 'practice') list = prep(shuffle(topic && topic !== 'all' ? QUESTIONS.filter(q => q.t === topic) : QUESTIONS));
  else if (mode === 'exam') list = prep(shuffle(QUESTIONS).slice(0, Math.min(20, QUESTIONS.length)));
  else if (mode === 'mistakes') list = prep(shuffle(QUESTIONS.filter(q => store.mistakes.includes(q.id))));
  else list = signQuestions();

  if (!list.length){
    paint(`<div class="empty">${icon('yield',80)}<h2>Xatolar daftari boʻsh</h2>
      <p>Mashq qiling. Adashgan savollar shu yerga tushadi va toʻgʻri javob berguncha qaytib chiqadi.</p>
      <button class="btn" data-act="topics">Mashqni boshlash</button>
      <button class="btn ghost" data-act="home">Bosh sahifa</button></div>`, 'empty');
    return;
  }
  Z = { mode, topic, list, i:0, score:0, wrong:[], locked:false };
  if (mode === 'exam'){
    Z.end = Date.now() + list.length*60*1000;
    timerId = setInterval(tick, 500);
  }
  renderQuiz();
}
function tick(){
  if (!Z || Z.mode !== 'exam') return stopTimer();
  const left = Math.max(0, Z.end - Date.now());
  const el = $('timer');
  if (el){ const s = Math.ceil(left/1000); el.textContent = String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); }
  if (left <= 0){ stopTimer(); finish(); }
}
function renderQuiz(){
  const q = Z.list[Z.i], n = Z.list.length;
  Z.locked = false;
  const dashes = Z.list.map((_,k) => `<i class="d ${k<Z.i?'on':k===Z.i?'cur':''}"></i>`).join('');
  const media = q.scene ? `<div class="scene">${sceneImg(q.scene)}</div>`
    : q.sign ? `<div class="signbox">${icon(q.sign,132)}</div>`
    : '';
  paint(`
    <div class="qhead">
      <button class="x" data-act="home" aria-label="Chiqish">✕</button>
      <div class="dashes">${dashes}</div>
      <span class="cnt">${Z.i+1}/${n}</span>
      ${Z.mode==='exam' ? '<span class="timer" id="timer"></span>' : ''}
    </div>
    <main class="qbody">
      ${media}
      <h2 class="qt">${q.q}</h2>
      <div class="opts">
        ${q.opts.map((t,k)=>`<button class="opt" data-k="${k}"><span class="l">${'ABCD'[k]}</span><span>${t}</span></button>`).join('')}
      </div>
      <div id="fb"></div>
    </main>
    <div class="bar" id="bar"></div>`, 'quiz');
  if (Z.mode === 'exam') tick();
}
function pick(k){
  if (!Z || Z.locked) return;
  Z.locked = true;
  const q = Z.list[Z.i], ok = (k === q.ans);
  record(q, ok);
  if (ok) Z.score++; else Z.wrong.push(q);
  haptic(ok);

  const btns = document.querySelectorAll('.opt');
  if (Z.mode === 'exam'){
    btns[k].classList.add('right');
    setTimeout(next, 260);
    return;
  }
  btns.forEach((b,i) => { b.classList.add('lock'); if (i===q.ans) b.classList.add('right'); });
  if (!ok) btns[k].classList.add('wrong');
  $('fb').innerHTML = `<div class="fb ${ok?'ok':'bad'}"><b>${ok?'Toʻgʻri':'Xato'}</b><p>${q.e}</p></div>`;
  const last = Z.i === Z.list.length-1;
  $('bar').innerHTML = `<button class="btn" data-act="next">${last?'Natijani koʻrish':'Keyingisi'}</button>`;
  $('fb').scrollIntoView({behavior:'smooth', block:'nearest'});
}
function next(){
  if (!Z) return;
  if (Z.i >= Z.list.length-1) return finish();
  Z.i++; renderQuiz();
}
function countUp(el, to){
  if (!el) return;
  const t0 = performance.now(), dur = 700;
  const step = t => { const p = Math.min(1,(t-t0)/dur); el.firstChild.nodeValue = Math.round(to*(1-Math.pow(1-p,3))); if (p<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function confetti(){
  const box = document.createElement('div'); box.className = 'confetti';
  const cols = ['#FFC72C','#2FB36D','#1F5FBF','#D62828','#F2F4F6'];
  for (let i=0;i<32;i++){
    const s = document.createElement('i');
    s.style.left = Math.random()*100 + '%';
    s.style.background = cols[i%cols.length];
    s.style.animationDelay = (Math.random()*.6) + 's';
    s.style.animationDuration = (1.6 + Math.random()*1.2) + 's';
    box.appendChild(s);
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 3400);
}
function finish(){
  stopTimer();
  const n = Z.list.length, pct = Math.round(Z.score/n*100);
  const exam = Z.mode === 'exam';
  const passed = pct >= 90;
  const head = exam ? (passed ? "Imtihondan oʻtdingiz" : "Imtihondan oʻtolmadingiz")
                    : (pct===100 ? "Aʼlo natija" : "Sessiya tugadi");
  const sub = exam ? "Oʻtish uchun kamida 90% kerak." : (Z.wrong.length ? "Xatolar daftariga saqlandi." : "Hech qanday xato yoʻq.");
  const wl = Z.wrong.length ? `<div class="wl">${Z.wrong.map(q => `
      <div><b>${q.q}</b><span>Toʻgʻri javob: ${q.opts[q.ans]}</span><em>${q.e}</em></div>`).join('')}</div>` : '';
  paint(`
    <div class="res">
      <div class="big"><span id="score">0</span><small>/${n}</small></div>
      <h2>${head}</h2>
      <p>${sub}</p>
      ${wl}
      <button class="btn" data-act="again">Qayta boshlash</button>
      <button class="btn ghost" data-act="home">Bosh sahifa</button>
    </div>`, 'result');
  countUp($('score'), Z.score);
  if (pct >= 90) { confetti(); haptic(true); }
}

/* ---------- Hodisalar ---------- */
$app.addEventListener('click', e => {
  const o = e.target.closest('.opt');
  if (o) return pick(+o.dataset.k);
  const tp = e.target.closest('[data-topic]');
  if (tp) return startQuiz('practice', tp.dataset.topic);
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const a = b.dataset.act;
  if (a === 'home') return home();
  if (a === 'next') return next();
  if (a === 'again') return startQuiz(Z ? Z.mode : 'practice', Z ? Z.topic : 'all');
  if (a === 'topics') return topics();
  if (a === 'signs') return startQuiz('signs');
  return startQuiz(a);
});
home();
</script>
</body>
</html>
